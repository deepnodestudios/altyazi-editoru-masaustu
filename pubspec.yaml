name: altyazi_editoru
description: AI Altyazı Çeviri ve Editör

publish_to: 'none'

version: 1.7.5
environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0
  provider: ^6.1.5+1
  flutter_svg: ^2.2.0
  package_info_plus: ^9.0.0
  file_picker: ^10.3.10
  http: ^1.1.0
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.2.2
  url_launcher: ^6.1.11
  flutter_local_notifications: ^20.0.0
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  window_manager: ^0.5.1
  wakelock_plus: ^1.1.0
  tutorial_coach_mark: ^1.2.1
  flutter_markdown: ^0.7.7+1
  font_awesome_flutter: ^10.12.0
  google_sign_in: ^6.3.0
  google_sign_in_dartio: ^0.3.0
  flutter_web_auth_2: ^5.0.1
  crypto: ^3.0.7
  path: ^1.8.3
  locale_names: 1.1.1
  share_plus: ^12.0.1
  path_provider: ^2.1.3
  flutter_email_sender: ^8.0.0
  auto_size_text: ^3.0.0
  google_generative_ai: ^0.4.7
  device_info_plus: ^11.5.0
  firebase_remote_config: ^6.1.4
  confetti: ^0.8.0
  in_app_purchase: ^3.2.3
  connectivity_plus: ^7.0.0
  archive: ^4.0.7
  cloud_functions: ^6.0.6
  charset: 2.0.1
  enough_convert: 1.6.0
  flutter_native_splash: ^2.4.6
  firebase_app_check: ^0.4.1+4
  desktop_drop: ^0.7.0
  super_drag_and_drop: ^0.9.1
  tray_manager: ^0.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  firebase_core_platform_interface: ^6.0.2
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.7.2

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/icon/cloud/

flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: false
  ios: false
  web:
    generate: true
  windows:
    generate: true
  macos:
    generate: true
  linux:
    generate: true

flutter_native_splash:
  background_image: assets/icon/splash_bg.png
  android: false
  ios: false
  web: false

  fullscreen: true
